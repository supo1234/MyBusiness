<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pyidaungsu', 'Playfair Display', serif;
            background-color: #f7f4ef;
            color: #4a4a4a;
            overflow-x: hidden;
        }

        /* ဘာသာစကား ပြောင်းတဲ့ ခလုတ် */
        .lang-switch {
            position: fixed;
            top: 15px;
            right: 15px;
            background: white;
            border: 1px solid #b38b6d;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* ပင်မ စာမျက်နှာ Container */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .invitation-card {
            background: white;
            max-width: 420px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
            border: 1px solid #eae1d4;
            /* Scroll လိုက်ရင် အပေါ်ကို ငြင်သာစွာ တက်လာမယ့် CSS Animation */
            animation: fadeInUp 1.2s ease-out; 
        }

        .hero-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .content {
            padding: 30px 20px;
        }

        .title {
            font-size: 26px;
            color: #b38b6d;
            margin-bottom: 10px;
        }

        .details {
            font-size: 16px;
            line-height: 1.8;
            margin: 20px 0;
        }

        .date-time {
            font-weight: bold;
            background: #fdfaf6;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #b38b6d;
        }

        /* Button ပုံစံများ */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            display: block;
            padding: 12px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background-color: #b38b6d;
            color: white;
        }

        .btn-secondary {
            background-color: #efede8;
            color: #4a4a4a;
        }

        /* စာသား လှုပ်လှုပ်လေး ဖြစ်စေမယ့် Animation အတန်းအစား */
        .pulse-effect {
            animation: pulse 2s infinite;
        }

        /* --- ဓာတ်ပုံကြည့်ရန် Page (အစပိုင်းမှာ ဖျောက်ထားမည်) --- */
        .gallery-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fdfbf7;
            z-index: 999;
            display: none; /* ဖျောက်ထားရန် */
            overflow-y: auto; /* အောက်ကို Scroll ဆွဲလို့ရအောင် */
            padding: 20px;
        }

        .gallery-header {
            max-width: 500px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
         .gallery-grid {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px; /* ပုံတစ်ပုံချင်းစီကြား အကွာအဝေး */
        }

        .gallery-item {
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .gallery-item img {
            width: 100%;
            border-radius: 8px;
            display: block;
            margin-bottom: 10px;
        }

        /* Save Button */
        .save-btn {
            background: #b38b6d;
            color: white;
            padding: 6px 15px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <button class="lang-switch" onclick="toggleLanguage()">English</button>

    <div class="main-container" id="mainPage">
        <div class="invitation-card">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=600" alt="Banner" class="hero-img animateanimated animatezoomIn">
            
            <div class="content">
                <h1 class="title pulse-effect" id="txtTitle">မင်္ဂလာဖိတ်ကြားလွှာ</h1>
                <p style="font-style: italic; color: #888;" id="txtSubtitle">Save The Date</p>
                
                <div class="details">
                    <p><strong id="txtGroomLabel">သတို့သား:</strong> <span id="txtGroomName">ကိုရှင်းသန့်</span></p>
                    <p><strong id="txtBrideLabel">သတို့သမီး:</strong> <span id="txtBrideName">မဆောင်းနှင်း</span></p>
                    
                    <div class="date-time animateanimated animatefadeInUp animate__delay-1s">
                        <p id="txtDate">📅 ၂၀၂၆ ခုနှစ်၊ မေလ (၂۴) ရက်</p>
                        <p id="txtTime">⏰ နံနက် (၉:၀၀) နာရီ မှ (၁၁:၀၀) နာရီအထိ</p>
                    </div>
                    
                    <p id="txtLocation">မင်္ဂလာခန်းမ၊ မန္တလေးမြို့။</p>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary animateanimated animatebounceIn" onclick="openGallery()" id="btnGallery">📸 ပုံများကြည့်ရန်</button>
                    <a href="https://maps.google.com" target="_blank" class="btn btn-secondary" id="btnMap">📍 Google Map သွားရန်</a>
                </div>
            </div>
        </div>
    </div>

    <div class="gallery-page animate__animated" id="galleryPage">
        <div class="gallery-header">
            <h2 id="galleryTitle">အမှတ်တရပုံရိပ်များ</h2>
            <button class="btn btn-secondary" style="padding: 5px 15px;" onclick="closeGallery()" id="btnBack">🔙 ပြန်ထွက်ရန်</button>
        </div>

        <div class="gallery-grid">
            <div class="gallery-item animateanimated animatefadeInUp">
                <img src="https://images.unsplash.com/photo-1606800052052-a08af7148866?q=80&w=600" alt="Photo 1">
                <a href="https://images.unsplash.com/photo-1606800052052-a08af7148866?q=80&w=600" download="Prewedding_1.jpg" target="_blank" class="save-btn" id="btnSave1">Save Image</a>
            </div>

            <div class="gallery-item animateanimated animatefadeInUp">
                <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=600" alt="Photo 2">
                <a href="https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=600" download="Prewedding_2.jpg" target="_blank" class="save-btn" id="btnSave2">Save Image</a>
            </div>

            <div class="gallery-item animateanimated animatefadeInUp">
                <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=600" alt="Photo 3">
                <a href="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=600" download="Prewedding_3.jpg" target="_blank" class="save-btn" id="btnSave3">Save Image</a>
            </div>
        </div>
    </div>

    <script>
        // ၁။ ပုံကြည့်ရန် စာမျက်နှာ အဖွင့်/အပိတ် လုပ်ဆောင်ချက်
        function openGallery() {
            const gallery = document.getElementById('galleryPage');
            gallery.style.display = 'block';
            gallery.classList.remove('animate__fadeOutDown');
            gallery.classList.add('animate__fadeInUp'); // အောက်ကနေ အထက်သို့ ပွင့်လာမည့်ပုံစံ
        }

        function closeGallery() {
            const gallery = document.getElementById('galleryPage');
            gallery.classList.remove('animate__fadeInUp');
            gallery.classList.add('animate__fadeOutDown'); // အောက်ကို ပြန်ဆင်းသွားမည့်ပုံစံ
            setTimeout(() => {
                gallery.style.display = 'none';
            }, 500); // Animation ပြီးမှ ဖျောက်ရန်
        }

        // ၂။ ဘာသာစကား (မြန်မာ/အင်္ဂလိပ်) ပြောင်းလဲခြင်း စနစ်
        let currentLang = 'MM';

        const translations = {
            MM: {
                title: "မင်္ဂလာဖိတ်ကြားလွှာ",
                sub: "Save The Date",
                groomLabel: "သတို့သား:",
                groomName: "ကိုရှင်းသန့်",
                brideLabel: "သတို့သမီး:",
                brideName: "မဆောင်းနှင်း",
                date: "📅 ၂၀၂၆ ခုနှစ်၊ မေလ (၂၄) ရက်",
                time: "⏰ နံနက် (၉:၀၀) နာရီ မှ (၁၁:၀၀) နာရီအထိ",
                location: "မင်္ဂလာခန်းမ၊ မန္တလေးမြို့။",
                btnGallery: "📸 ပုံများကြည့်ရန်",
                btnMap: "📍 Google Map သွားရန်",
                galleryTitle: "အမှတ်တရပုံရိပ်များ",
                btnBack: "🔙 ပြန်ထွက်ရန်",
                btnSave: "Save Image"
            },
            EN: {
                title: "Wedding Invitation",
                sub: "Save The Date",
                groomLabel: "Groom:",
                groomName: "Shin Thant",
                brideLabel: "Bride:",
                brideName: "Saung Hnin",
                date: "📅 May 24, 2026",
                time: "⏰ 09:00 AM - 11:00 AM",
                location: "Mandalay Wedding Hall, Mandalay.",
                btnGallery: "📸 View Gallery",
                btnMap: "📍 Open Google Map",
                galleryTitle: "Prewedding Gallery",
                btnBack: "🔙 Back",
                btnSave: "Download"
            }
        };

        function toggleLanguage() {
            const btn = document.querySelector('.lang-switch');
            if (currentLang === 'MM') {
                currentLang = 'EN';
                btn.innerText = 'မြန်မာ';
            } else {
                currentLang = 'MM';
                btn.innerText = 'English';
            }

            // စာသားများကို သက်ဆိုင်ရာ ဘာသာစကားသို့ ပြောင်းလဲခြင်း
            const data = translations[currentLang];
            document.getElementById('txtTitle').innerText = data.title;
            document.getElementById('txtSubtitle').innerText = data.sub;
            document.getElementById('txtGroomLabel').innerText = data.groomLabel;
            document.getElementById('txtGroomName').innerText = data.groomName;
            document.getElementById('txtBrideLabel').innerText = data.brideLabel;
            document.getElementById('txtBrideName').innerText = data.brideName;
            document.getElementById('txtDate').innerText = data.date;
            document.getElementById('txtTime').innerText = data.time;
            document.getElementById('txtLocation').innerText = data.location;
            document.getElementById('btnGallery').innerText = data.btnGallery;
            document.getElementById('btnMap').innerText = data.btnMap;
            document.getElementById('galleryTitle').innerText = data.galleryTitle;
            document.getElementById('btnBack').innerText = data.btnBack;
            
            // Save Button စာသားများ ပြောင်းလဲခြင်း
            document.getElementById('btnSave1').innerText = data.btnSave;
            document.getElementById('btnSave2').innerText = data.btnSave;
            document.getElementById('btnSave3').innerText = data.btnSave;
        }
    </script>
</body>
</html>
